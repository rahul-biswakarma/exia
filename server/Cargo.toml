[package]
name = "exia-server"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
default-net = { version = "0.22.0", features = ["serde"] }
ipnet = { version = "2.11.0", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
pnet = "0.35.0"
dns-lookup = "2.0.4"
